<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela parte 1</title>
    <style>
        body {
            font-family:Arial, Helvetica, sans-serif ;
            
        }
        h1 {
            text-align: center;
            font-size: 50px;
        }
        table td  {

            border: 1px solid  black ;
            border-radius: 5px;
            
            padding: 10px;
            border-collapse: collapse;
            text-align: center;
           
        }  
        
    </style>
</head>
<body>
    <h1>tabela de números</h1>
    <table style="width:50%">
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
            <td>4</td>
        </tr>
          <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
        </tr>
        <tr>
            <td colspan="3">8</td>
            <td>9</td>
        </tr>
          <tr>
            <td rowspan="2">10</td>
            <td colspan="2">11</td>
            <td>12</td>
        </tr>
          <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
        </tr>
    </table>
</body>
</html>
