<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript</title>
</head>
<body>
    <a href="#" onclick="clicou">Clique em mim</a>
    <div id="saida"></div>



    <script>
        function clicou() {
            s= window.document.getElementById("saida")  
            s.innerHTML += '<p>Vocé clicou</p>'
        }
    </script>
</body>
</html>
