<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

    <p>
        <label for="iano" >Em que ano vocé nasceu?</label>
        <input type="number" name="ano" id="iano" min="1900" max="2025"
        oninput="calcIdade()">
    </p>

    <p>
        <label for="iidade">Sua Idade:</label>
        <output id="idade">0</output>
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="limpar">
    </p>
    </form>
    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.vallue)
        }        
    </script>
</body>
</html>
